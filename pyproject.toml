# : schema https://json.schemastore.org/pyproject.json
[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Abdur Rab Khan", email = "abdurrabkhan3263@gmail.com" }]
dependencies = [
  "bcrypt>=5.0.0",
  "fastapi[standard]>=0.143.3",
  "httpx[cli]>=0.28.1",
  "pydantic>=2.14.0",
  "pydantic-settings>=2.15.0",
  "sqlmodel>=0.0.48",
]

[project.scripts]
# lint = "ruff check" ❌ Here we can't run library/package run just script
# Let's break down this:
#   1. "python.main" -> "python/main.py"
#   2. ":main"       -> "it's the function name inside main.py file"
# * Similar to "python -m python.main"
start = "python.main:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "ruff>=0.17.0",
  "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.03_tools.fast-api.main:app"

[tool.uv]
package = false
