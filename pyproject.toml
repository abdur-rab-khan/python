# : schema https://json.schemastore.org/pyproject.json
[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Abdur Rab Khan", email = "abdurrabkhan3263@gmail.com" }]
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.143.3",
    "httpx[cli]>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = ["pyright>=1.1.414", "ruff>=0.17.0", "ty>=0.0.84"]

# 👉 This repo is a set of learning scripts, not an installable package.
#    "package = false" tells uv to only manage the virtual environment and
#    never run a build step, so no build-backend / module-name is needed.
[tool.uv]
package = false

